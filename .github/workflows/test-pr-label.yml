name: if_merged

on:
  pull_request_target:
    types:
      - closed

jobs:
  if_merged:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
    - run: |
        echo The PR was merged
  if_bug_label:
    if: github.event.label.name == 'bug'
    runs-on: ubuntu-latest
    steps:
    - run: |
        echo The PR had the bug label
