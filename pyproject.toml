[project]
authors = [{name = "avcopan", email = "avcopan@gmail.com"}]
dependencies = []
name = "test-release-workflow"
requires-python = ">= 3.11"
version = "0.2025.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
test_release_workflow = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
bumpver = ">=2025.1131,<2026"

[tool.bumpver]
current_version = "0.2025.0"
version_pattern = "MAJOR.YYYY.PATCH"
commit_message = "Release {new_version}"
tag_message = "{new_version}"
tag_scope = "default"
pre_commit_hook = "scripts/update_lockfile.sh"
post_commit_hook = ""
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'version = "{version}"',
]
"src/test_release_workflow/__init__.py" = [
    '__version__ = "{version}"',
]
